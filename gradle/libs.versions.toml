# Versions of telemetrykit-android. Pinned exactly; upgrade deliberately and run ./gradlew check.
[versions]
kotlin = "2.3.21"
coroutines = "1.10.2"
serialization = "1.9.0"
okhttp = "4.12.0"
junit = "4.13.2"
# The Android companion (androidx/): the versions the Baby Zzz app pins, so apps resolve identical artifacts
agp = "8.13.0"
# What the Baby Zzz app's Compose BOM 2026.03.01 resolves androidx.compose.ui to; pinned without the BOM so the POM carries versions
composeUi = "1.10.6"
lifecycle = "2.9.4"
robolectric = "4.16.1"
robolectricNativeArm64 = "4.17-1"
# Robolectric 4.16.1 brings Conscrypt 2.5.2, which has no linux-aarch_64 native binaries (CI agent build-1 may be aarch64)
conscrypt = "2.8.0"
# Robolectric 4.16.1 asks for Bouncy Castle 1.81 (CVEs; test classpath only)
bouncyCastle = "1.85"
guava = "33.7.2"
androidxTestCore = "1.7.0"
androidxTestExt = "1.3.0"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime", version.ref = "lifecycle" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "composeUi" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "composeUi" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "composeUi" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "composeUi" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
robolectric-nativeruntime-arm64 = { module = "io.github.lavishsonbhurra:robolectric-nativeruntime-linux-aarch64", version.ref = "robolectricNativeArm64" }
conscrypt-openjdk-uber = { module = "org.conscrypt:conscrypt-openjdk-uber", version.ref = "conscrypt" }
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncyCastle" }
guava-jre = { module = "com.google.guava:guava", version.ref = "guava" }
androidx-test-core = { module = "androidx.test:core-ktx", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit-ktx", version.ref = "androidxTestExt" }

[plugins]
maven-publish = { id = "com.vanniktech.maven.publish", version = "0.34.0" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
